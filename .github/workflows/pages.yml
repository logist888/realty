name: Deploy Babylon to GitHub Pages

# Публикует папку babylon/ как статический сайт (Telegram Mini App).
on:
  push:
    branches:
      - claude/eager-fermi-0el3ws
      - main
    paths:
      - 'babylon/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload babylon/ as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: babylon
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
